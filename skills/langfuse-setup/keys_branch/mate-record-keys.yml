# Locks the repo's Langfuse keys again for every laptop listed, after each push to
# this branch. Written by /mate-record:langfuse-setup; lives only on this branch.
name: mate-record keys
on:
  push:
    branches: [mate-record-keys]
permissions:
  contents: write
concurrency:
  group: mate-record-keys
  cancel-in-progress: false
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      # The branch's newest commit, so a run that waited covers every laptop.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pyrage==1.4.0
      - name: Lock again for every laptop
        env:
          MATE_RECORD_CI_KEY: ${{ secrets.MATE_RECORD_CI_KEY }}
        run: python mate-record/relock.py
      - name: Commit the new lock file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mate-record/langfuse-keys.age
          git commit -m 'Lock the Langfuse keys for every laptop'
          git push origin "HEAD:${GITHUB_REF_NAME}"
