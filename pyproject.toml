[project]
name = "claude-observability-plugin"
version = "3.1.1"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "langfuse>=4.2,<5",
  "pyrage==1.4.0",
  "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "hooks"]
addopts = "-ra"
